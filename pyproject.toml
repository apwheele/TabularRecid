[project]
name = "tabrecid"
version = "0.1.0"
description = "Tabular foundation models for recidivism prediction with small samples"
readme = "README.md"
authors = [
    { name = "apwheele", email = "apwheele@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "structured-data-models",
    "tabpfn>=9.0.0",
    "tabulate>=0.10.0",
    "torch>=2.7",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
